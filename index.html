<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cek Status Kompetenmu di Sini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#d9e021;
  --forest:#0b360f;
  --mint:#d5f7d8;
  --mint-pale:#f7fdf7;
  --white:#ffffff;
  --chlorophyll:#2a7d34;
  --grey:#8f9a90;
  --radius-xl:34px;
  --radius-lg:26px;
  --radius-md:18px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--mint);
  color:var(--forest);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:0 0 60px;
}
.page{width:100%;max-width:480px;padding:0 18px}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(160deg, var(--lime) 0%, #eef3a8 60%, var(--mint-pale) 100%);
  border-radius:0 0 var(--radius-xl) var(--radius-xl);
  margin:0 -18px;
  padding:56px 26px 40px;
  text-align:center;
}
.eyebrow{
  display:inline-block;
  font-size:12.5px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--forest);
  background:rgba(255,255,255,.55);
  padding:6px 14px;
  border-radius:999px;
  margin-bottom:16px;
}
.hero h1{
  font-size:clamp(30px,8vw,42px);
  font-weight:900;
  line-height:1.15;
  letter-spacing:-.03em;
  color:var(--forest);
}

/* ---------- SEARCH ---------- */
.search-wrap{margin:22px 0 0}
.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--white);
  border-radius:999px;
  padding:14px 18px;
  box-shadow:0 6px 20px rgba(11,54,15,.10);
}
.search-box svg{flex:none;color:var(--forest);opacity:.55}
.search-box input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  color:var(--forest);
}
.search-box input::placeholder{color:rgba(11,54,15,.45);font-weight:500}

.result-panel{margin-top:14px}
.result-panel[hidden]{display:none}

.count{font-size:12px;font-weight:700;color:rgba(11,54,15,.55);margin:2px 4px 8px}

.result-list{list-style:none;background:var(--white);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(11,54,15,.06)}
.result-list li{border-top:1px solid rgba(11,54,15,.08)}
.result-list li:first-child{border-top:0}
.result-list li.empty{padding:20px 16px;text-align:center;color:rgba(11,54,15,.55);font-weight:600;font-size:14px}
.result-list mark{background:var(--lime);color:var(--forest);border-radius:3px;padding:0 1px}

@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result-list li.pop{animation:popIn .28s var(--ease) both}

.result-item summary{
  list-style:none;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px;
  cursor:pointer;
  font-size:14.5px; font-weight:700; color:var(--forest);
}
.result-item summary::-webkit-details-marker{display:none}
.result-item summary .chev{flex:none; transition:transform .2s ease; opacity:.6}
.result-item[open] summary .chev{transform:rotate(180deg)}
.status-panel{padding:2px 16px 16px; display:flex; flex-direction:column; gap:2px}
.status-label{font-size:13px; font-weight:600; color:rgba(11,54,15,.55)}
.status-value{display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:800; color:var(--forest)}
.status-value svg{flex:none}
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <span class="eyebrow">LSP UI Bunga Bangsa Cirebon</span>
    <h1>Cek Status Kompetenmu di Sini</h1>
  </div>

  <div class="search-wrap">
    <label class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Cari nama peserta" autocomplete="off" enterkeyhint="search">
    </label>

    <div class="result-panel" id="resultPanel" hidden>
      <p class="count" id="countLabel" hidden></p>
      <ul class="result-list" id="resultList" hidden></ul>
    </div>
  </div>

</div>

<script>
const PESERTA = [
  // Doktor
  "Cory Vidiati",
  "Moh Sholeh",
  "Muhammadun",
  "Yanti Yulianti",
  // Magister
  "Agus Karjuni",
  "Bambang Wahyudi Wicaksono",
  "Dapiah",
  "Dini Selasi",
  "Elis Siti Maria Ulfah",
  "Hajjin Mabrur",
  "Iis Holiah",
  "Inu Eka Nugraha",
  "Mohammad Ridwan",
  "Muhammad Agung Rifat Syauqi",
  "Muhammad Dicky Hasbi Ash Shiddieqy",
  "Muhammad Riff'an Alghiffari",
  "Rachmi Fitria Mustari",
  "Ulfiyah",
  // Sarjana
  "Ahmad Hasan Hariri",
  "Amar Panji Alkautsar",
  "Firman Syawaludin",
  "Obbi Ihza Awali",
  "Ricky Rizky Masri",
  "Yono Suryono"
];

(function(){
  const input = document.getElementById('searchInput');
  const panel = document.getElementById('resultPanel');
  const loadingRow = document.getElementById('loadingRow');
  const countLabel = document.getElementById('countLabel');
  const list = document.getElementById('resultList');

  const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const loose = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  const PESERTA_LOOSE = PESERTA.map(loose);

  let shown = new Set();

  function renderResults(){
    const raw = input.value.trim();
    const q = loose(raw);
    const hits = PESERTA.filter((_, i) => PESERTA_LOOSE[i].includes(q));
    const re = new RegExp('(' + escRe(raw) + ')', 'ig');
    let k = 0;
    list.innerHTML = hits.length
      ? hits.map(n => {
          const isNew = !shown.has(n);
          const style = isNew ? ' class="pop" style="animation-delay:' + (Math.min(k++, 8) * 50) + 'ms"' : '';
          const nameHtml = esc(n).replace(re, '<mark>$1</mark>');
          return '<li' + style + '><details class="result-item">' +
            '<summary><span>' + nameHtml + '</span>' +
            '<svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
            '</summary>' +
            '<div class="status-panel">' +
              '<div class="status-label">Status Kompeten:</div>' +
              '<div class="status-value">Direkomendasikan Kompeten ' +
                '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10" fill="#3aa63a"/><path d="M8 12.3l2.6 2.6L16 9.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</div>' +
            '</div>' +
          '</details></li>';
        }).join('')
      : '<li class="empty">Nama tidak ditemukan</li>';
    shown = new Set(hits);
    countLabel.textContent = hits.length + ' dari ' + PESERTA.length + ' peserta';
  }

  function handleInput(){
    const raw = input.value.trim();

    if(!raw){
      panel.hidden = true;
      countLabel.hidden = true;
      list.hidden = true;
      shown = new Set();
      return;
    }

    panel.hidden = false;
    renderResults();
    countLabel.hidden = false;
    list.hidden = false;
  }

  input.addEventListener('input', handleInput);
})();
</script>
</body>
</html>
